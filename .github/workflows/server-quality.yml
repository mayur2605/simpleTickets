name: Server quality

# The gate only. Nothing deploys from here, and there is nowhere to deploy to:
# the application runs locally and production hosting is deliberately undecided
# (see docs/superpowers/specs/2026-09-17-local-replatform-design.md).
#
# This replaces worker-quality.yml, and it can do something that one could not:
# run the integration tests. Under D1 the only database was Cloudflare's, so
# store.ts had no tests at all. A PostgreSQL service container gives CI the same
# database a developer has.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "prototype/src/domain/**"
      - ".github/workflows/server-quality.yml"
  pull_request:
    paths:
      - "server/**"
      - "prototype/src/domain/**"
      - ".github/workflows/server-quality.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # The server imports the business calendar from prototype/src/domain, so a
    # change there can break the server's tests. That is why this workflow
    # watches that path too - one implementation of the deadline rules is the
    # point, and CI has to notice when it moves.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simpletickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simpletickets_test
      # Named explicitly, not left to PATH. `apt install postgresql-client-18`
      # installs here but leaves /usr/bin/pg_dump on the distro's older version,
      # so the install step succeeds and pg_dump then refuses the 18 server with
      # "aborting because of server version mismatch".
      PG_BIN: /usr/lib/postgresql/18/bin

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24: the server runs TypeScript directly by type stripping, with
          # no bundler and no tsx. An older Node cannot start it.
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # pg_dump and pg_restore for the backup restore test. The client version
      # must not be older than the server's, or pg_restore refuses the dump.
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      # typecheck + lint + format:check + unit tests + integration tests.
      - run: npm run verify
