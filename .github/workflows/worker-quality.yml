name: Worker quality

# Deployment is NOT done here. Cloudflare Workers Builds owns deploys: it pulls
# this repository directly, so no Cloudflare credential is stored in GitHub.
# This workflow only runs the gate, and unlike the deploy path it also covers
# pull requests.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-quality.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-quality.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # typecheck + unit tests + `wrangler deploy --dry-run`. The dry run needs
      # no Cloudflare credential.
      - run: npm run verify
