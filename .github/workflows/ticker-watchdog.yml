name: Ticker watchdog

# The ingestion chain is a Durable Object alarm that reschedules itself. If that
# chain ever ends - an evicted object, a lost alarm - nothing inside Cloudflare
# restarts it, because this account's cron triggers do not fire (see
# docs/stack-validation.md). Mail would then stop becoming tickets silently.
#
# This is the only independent timer available: every other option lives inside
# the same platform that already failed to schedule anything. GitHub's scheduled
# runs are themselves unreliable and often delayed, which is fine for a watchdog
# and would NOT be fine as the primary driver.
#
# Reading /ticker heals it: the status route re-arms a chain that is wanted but
# has no alarm. So this workflow only has to look.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ticker-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check and heal the ingestion ticker
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: https://simpletickets-api.simpleticketssupport.workers.dev
        run: |
          set -uo pipefail

          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN is not set; the watchdog cannot check anything"
            exit 1
          fi

          body=$(curl -sS --max-time 45 -H "x-admin-token: $ADMIN_TOKEN" "$WORKER_URL/ticker")
          echo "$body"

          # A wrong or missing token gets the same 404 as an unknown route, so an
          # unparseable answer is a failure, never evidence of health.
          if ! printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
            echo "::error::ticker did not return JSON - wrong token, or the worker is down"
            exit 1
          fi

          wanted=$(printf '%s' "$body" | jq -r '.wanted')
          healed=$(printf '%s' "$body" | jq -r '.healed')
          stalled=$(printf '%s' "$body" | jq -r '.stalled')
          silent=$(printf '%s' "$body" | jq -r '.silentMinutes')
          last=$(printf '%s' "$body" | jq -r '.last.at // "never"')

          if [ "$wanted" != "true" ]; then
            echo "::notice::ticker is deliberately stopped; nothing to do"
            exit 0
          fi

          if [ "$healed" = "true" ]; then
            echo "::warning::ticker chain had stopped and was restarted by this check"
            exit 0
          fi

          if [ "$stalled" = "true" ]; then
            echo "::error::ticker is stalled - silent for $silent minutes (last tick $last)"
            exit 1
          fi

          echo "::notice::ticker healthy - last tick $last"
