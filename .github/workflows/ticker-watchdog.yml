name: Ticker watchdog

# The ingestion chain is a Durable Object alarm that reschedules itself. If that
# chain ever ends - an evicted object, a lost alarm - nothing inside Cloudflare
# restarts it, because this account's cron triggers do not fire (see
# docs/stack-validation.md). Mail would then stop being ingested silently, with
# no error anywhere.
#
# This is the only independent timer available: every other option lives inside
# the same platform that already failed to schedule anything. GitHub's scheduled
# runs are themselves unreliable and often delayed by tens of minutes, which is
# fine for a watchdog and would NOT be fine as the primary driver.
#
# Reading /ticker heals it: the status route re-arms a chain that is wanted but
# has no alarm. So this workflow only has to look.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ticker-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check and heal the ingestion ticker
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: https://simpletickets-api.simpleticketssupport.workers.dev
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN is not set; the watchdog cannot check anything."
            exit 1
          fi

          body=$(curl -sS --max-time 45 -H "x-admin-token: $ADMIN_TOKEN" "$WORKER_URL/ticker")
          echo "$body"

          # A wrong or missing token gets the same 404 as an unknown route, so
          # treat an unparseable answer as a failure rather than as health.
          echo "$body" | python3 -c '
import sys, json
try:
    d = json.loads(sys.stdin.read())
except Exception:
    print("::error::ticker did not return JSON - wrong token, or the worker is down")
    sys.exit(1)

if not d.get("wanted"):
    print("::notice::ticker is deliberately stopped; nothing to do")
    sys.exit(0)

if d.get("healed"):
    print("::warning::ticker chain had stopped and was restarted")
    sys.exit(0)

if d.get("stalled"):
    print(f"::error::ticker is stalled - silent for {d.get(\"silentMinutes\")} minutes")
    sys.exit(1)

print(f"::notice::ticker healthy, last tick {(d.get(\"last\") or {}).get(\"at\")}")
'
