name = "simpletickets-api"
main = "src/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

# This publishes a public *.workers.dev URL. The worker is reachable from the
# internet, and the only thing in front of it is the ADMIN_TOKEN check in
# src/index.ts, which returns 404 (not 401) so the routes do not announce
# themselves. Ingestion itself is driven by cron, not by HTTP; the routes exist
# for operating and debugging. Setting this to false removes the public URL and
# with it the manual /poll escape hatch, which is currently the only thing that
# has ever successfully triggered ingestion.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "simpletickets"
database_id = "3f3e60f6-f181-4e56-a387-89678a34d538"

# R02: check for new mail every two minutes.
[triggers]
crons = ["*/2 * * * *"]

[vars]
GMAIL_USER = "simpleticketssupport@gmail.com"

[observability]
enabled = true

# Secrets, set with `wrangler secret put`:
#   GMAIL_APP_PASSWORD, ADMIN_TOKEN
